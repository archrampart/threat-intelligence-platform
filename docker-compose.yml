services:
  # Redis Cache
  redis:
    image: redis:alpine
    container_name: tip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: tip-backend
    ports:
      - "8777:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - DATABASE_URL=sqlite:///./threat_intel.db
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-32-byte-encryption-key!!}
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - WATCHLIST_SCHEDULER_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: tip-frontend
    ports:
      - "4765:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
  backend-data:
